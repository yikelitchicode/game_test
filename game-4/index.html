<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2048 | Game 4</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <a href="/" class="back" aria-label="Back to game launcher">&#8592;</a>
        <div class="title"><span>GAME 4</span><h1>2048</h1></div>
        <button class="icon-button" id="newGame" type="button" aria-label="Start a new game" title="New game">&#8635;</button>
      </header>

      <section class="game-card">
        <div class="scorebar">
          <div class="score"><span>Score</span><strong id="score">0</strong></div>
          <div class="score"><span>Best</span><strong id="best">0</strong></div>
          <button id="undo" class="undo" type="button" disabled>Undo</button>
        </div>
        <div class="board" id="board" aria-label="2048 game board" tabindex="0">
          <div class="cells" aria-hidden="true"></div>
          <div class="tiles" id="tiles"></div>
          <div class="overlay" id="overlay" hidden>
            <p id="resultLabel">No more moves</p>
            <button id="playAgain" type="button">Play again</button>
          </div>
        </div>
      </section>
      <p class="hint">Swipe or use arrow keys</p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
