<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>game_test</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="phone-home" aria-label="Game launcher">
      <div class="wallpaper-shape shape-one" aria-hidden="true"></div>
      <div class="wallpaper-shape shape-two" aria-hidden="true"></div>
      <div class="wallpaper-shape shape-three" aria-hidden="true"></div>

      <nav class="app-grid" aria-label="Games">
        <div class="app-entry">
          <a class="app-icon cell-icon" href="/game-1/" aria-label="Play Cell Clash" title="Cell Clash"><span class="cell cell-large"></span><span class="cell cell-small"></span><span class="cell cell-tiny"></span></a>
          <span class="app-label">Cell Clash</span>
        </div>
        <div class="app-entry">
          <a class="app-icon cat-icon" href="/game-2/" aria-label="Play the cat adventure" title="無名的流浪貓"><span class="cat-ear left"></span><span class="cat-ear right"></span><span class="cat-face"><i></i><i></i><b></b></span></a>
          <span class="app-label">流浪貓</span>
        </div>
        <div class="app-entry">
          <a class="app-icon ship-icon" href="/game-3/" aria-label="Play Deep Space Hunter" title="星際戰機：深空獵手"><span class="star star-a"></span><span class="star star-b"></span><span class="star star-c"></span><span class="ship"><i></i></span></a>
          <span class="app-label">深空獵手</span>
        </div>
        <div class="app-entry">
          <a class="app-icon puzzle-icon" href="/game-4/" aria-label="Play 2048" title="2048"><span>2048</span></a>
          <span class="app-label">2048</span>
        </div>
        <div class="app-entry">
          <a class="app-icon snake-icon" href="/game-5/" aria-label="Play Snake" title="Snake"><span class="snake-body"></span><span class="snake-eye"></span></a>
          <span class="app-label">Snake</span>
        </div>
        <div class="app-entry">
          <a class="app-icon dino-icon" href="/game-6/" aria-label="Play Dino Run" title="Dino Run"><span class="dino-head"></span><span class="dino-leg"></span><span class="cactus"></span></a>
          <span class="app-label">Dino Run</span>
        </div>
        <div class="app-entry">
          <a class="app-icon dungeon-icon" href="/game-7/" aria-label="Play Dungeon Run" title="Dungeon Run"><span class="dungeon-door"></span><span class="dungeon-gem"></span></a>
          <span class="app-label">Dungeon Run</span>
        </div>
        <div class="app-entry">
          <a class="app-icon tower-icon" href="/game-8/" aria-label="Play Tower Defense" title="Tower Defense"><span class="tower-base"></span><span class="tower-top"></span><span class="tower-shot"></span></a>
          <span class="app-label">Tower Defense</span>
        </div>
        <div class="app-entry"><a class="app-icon arena-icon" href="/game-9/" aria-label="Play Arena Clash" title="Arena Clash"><span class="arena-gun"></span><span class="arena-dot"></span></a><span class="app-label">Arena Clash</span></div>
      </nav>

      <footer class="dock" aria-label="Quick launch">
        <a class="dock-icon cell-icon" href="/game-1/" aria-label="Play Cell Clash" title="Cell Clash"><span class="cell cell-large"></span><span class="cell cell-small"></span></a>
        <a class="dock-icon cat-icon" href="/game-2/" aria-label="Play the cat adventure" title="無名的流浪貓"><span class="cat-ear left"></span><span class="cat-ear right"></span><span class="cat-face"><i></i><i></i><b></b></span></a>
        <a class="dock-icon ship-icon" href="/game-3/" aria-label="Play Deep Space Hunter" title="星際戰機：深空獵手"><span class="ship"><i></i></span></a>
        <a class="dock-icon puzzle-icon" href="/game-4/" aria-label="Play 2048" title="2048"><span>2048</span></a>
      </footer>
    </main>
  </body>
</html>
