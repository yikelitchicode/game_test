<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Dungeon Run | Game 7</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="shell"><header><a class="back" href="/" aria-label="Back to launcher">&#8592;</a><div><small>GAME 7</small><h1>Dungeon Run</h1></div><button id="newGame" class="new" aria-label="Start a new run">&#8635;</button></header>
<section class="game"><div class="status"><div><span>Floor</span><strong id="floor">1</strong></div><div class="health"><span>Health</span><b><i id="health"></i></b><strong id="healthText">18 / 18</strong></div><div><span>Gold</span><strong id="gold">0</strong></div></div><canvas id="map" width="600" height="440" aria-label="Dungeon map"></canvas><p id="event" class="event">Find the stairs.</p><div class="controls" aria-label="Move hero"><button data-move="up">&#9650;</button><button data-move="left">&#9664;</button><button data-move="down">&#9660;</button><button data-move="right">&#9654;</button></div></section>
<section class="log"><p>Adventure log</p><div id="log"></div></section><section id="upgrade" class="modal" hidden><p>Level up</p><h2>Choose a blessing</h2><div id="choices"></div></section><section id="end" class="modal" hidden><p id="endKicker">The dungeon claims another hero</p><h2 id="endTitle">Run ended</h2><button id="again">Start a new run</button></section></main><script src="app.js"></script></body></html>
