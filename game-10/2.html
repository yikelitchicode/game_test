<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Hades 2 - Boon Selection UI</title>
  <style>
    :root {
      --bg-dark: rgba(12, 10, 18, 0.92);
      --gold-primary: #d4af37;
      --gold-light: #f6e69f;
      --melinoe-green: #20b2aa;
      --melinoe-glow: rgba(32, 178, 170, 0.6);
      --rarity-common: #a0a0a0;
      --rarity-rare: #4a90e2;
      --rarity-epic: #a335ee;
      --rarity-heroic: #e67e22;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      width: 100vw;
      height: 100vh;
      background: #08060a url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1920&q=80') center/cover;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Times New Roman', serif, "Microsoft JhengHei";
      overflow: hidden;
    }

    /* 遮罩背景 */
    .overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(16, 12, 26, 0.7) 0%, rgba(4, 3, 8, 0.95) 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* 頂部標題區域 */
    .header {
      text-align: center;
      margin-bottom: 40px;
      animation: fadeInDown 0.8s ease-out;
    }

    .god-title {
      color: var(--melinoe-green);
      font-size: 1.2rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-shadow: 0 0 10px var(--melinoe-glow);
    }

    .main-title {
      color: var(--gold-light);
      font-size: 2.8rem;
      font-weight: bold;
      letter-spacing: 2px;
      text-shadow: 0 0 15px rgba(212, 175, 55, 0.5), 2px 2px 4px #000;
      margin-top: 5px;
    }

    /* 三選一卡片容器 */
    .boons-container {
      display: flex;
      gap: 25px;
      perspective: 1000px;
    }

    /* 單張 Boon 卡片 */
    .boon-card {
      width: 300px;
      min-height: 420px;
      background: var(--bg-dark);
      border: 2px solid #3a3245;
      border-radius: 8px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 15px rgba(255,255,255,0.03);
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      animation: fadeInUp 0.8s ease-out;
    }

    /* 金屬邊框飾條 (Hades 特色) */
    .boon-card::before {
      content: '';
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      border-radius: 9px;
      border: 1px solid transparent;
      background: linear-gradient(135deg, var(--gold-primary), transparent 40%, transparent 60%, var(--melinoe-green)) border-box;
      mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0.5;
      transition: opacity 0.3s;
    }

    /* Hover 懸停效果 */
    .boon-card:hover {
      transform: translateY(-12px) scale(1.03);
      border-color: var(--gold-primary);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9), 0 0 25px var(--melinoe-glow);
    }

    .boon-card:hover::before {
      opacity: 1;
    }

    /* 卡片頭部: 圖示 + 槽位 */
    .card-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
    }

    .boon-icon {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #1a1622;
      border: 2px solid var(--gold-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.5rem;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
    }

    .boon-slot {
      font-size: 0.85rem;
      color: #8a8296;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    /* 稀有度標籤 */
    .rarity-tag {
      font-size: 0.95rem;
      font-weight: bold;
      letter-spacing: 1px;
      margin-top: 2px;
    }
    .rarity-common { color: var(--rarity-common); }
    .rarity-rare { color: var(--rarity-rare); text-shadow: 0 0 8px rgba(74, 144, 226, 0.5); }
    .rarity-epic { color: var(--rarity-epic); text-shadow: 0 0 8px rgba(163, 53, 238, 0.5); }
    .rarity-heroic { color: var(--rarity-heroic); text-shadow: 0 0 8px rgba(230, 126, 34, 0.5); }

    /* 祝福名稱與描述 */
    .boon-name {
      font-size: 1.4rem;
      color: #fff;
      margin-bottom: 12px;
      font-weight: bold;
    }

    .boon-desc {
      font-size: 0.95rem;
      color: #c4becc;
      line-height: 1.5;
      flex-grow: 1;
    }

    /* 數值高亮 */
    .highlight {
      color: var(--gold-light);
      font-weight: bold;
    }

    /* 底部選擇提示按鈕 */
    .select-btn {
      margin-top: 20px;
      padding: 10px;
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid var(--gold-primary);
      color: var(--gold-light);
      text-align: center;
      border-radius: 4px;
      font-size: 0.9rem;
      letter-spacing: 2px;
      transition: all 0.2s;
    }

    .boon-card:hover .select-btn {
      background: var(--gold-primary);
      color: #000;
      font-weight: bold;
      box-shadow: 0 0 10px var(--gold-primary);
    }

    /* 動畫定義 */
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="overlay">
    <div class="header">
      <div class="god-title">◆ APOLLO ◆</div>
      <div class="main-title">太陽神阿波羅的祝福</div>
    </div>

    <!-- 祝福三選一區域 -->
    <div class="boons-container" id="boonsContainer">
      <!-- 卡片由 JavaScript 動態生成 -->
    </div>
  </div>

  <script>
    // 模擬傳入的三選一祝福資料池
    const boonChoices = [
      {
        id: "apollo_attack",
        god: "Apollo",
        slotName: "【普通攻擊】",
        name: "熾耀耀擊",
        rarity: "epic",
        rarityText: "Epic 史詩",
        icon: "☀️",
        description: "你的普通攻擊範圍擴大 <span class='highlight'>+48%</span>，並造成額外傷害。",
        statBonus: { attackArea: 0.48, attackDamage: 0.30 }
      },
      {
        id: "apollo_cast",
        god: "Apollo",
        slotName: "【魔法陣】",
        name: "日輪法陣",
        rarity: "rare",
        rarityText: "Rare 稀有",
        icon: "⭕",
        description: "你的法陣會不斷向外擴張，並給予陣內敵人 <span class='highlight'>眩目 (Daze)</span> 效果。",
        statBonus: { castRadius: 0.35 }
      },
      {
        id: "apollo_sprint",
        god: "Apollo",
        slotName: "【長按衝刺】",
        name: "炫光奔襲",
        rarity: "common",
        rarityText: "Common 普通",
        icon: "🏃",
        description: "長按衝刺時移動速度增加 <span class='highlight'>+20%</span>，且身後留下一道灼熱光軌。",
        statBonus: { sprintSpeed: 0.20 }
      }
    ];

    const container = document.getElementById('boonsContainer');

    // 動態渲染三張卡片
    function renderBoons() {
      container.innerHTML = '';

      boonChoices.forEach((boon, index) => {
        const card = document.createElement('div');
        card.className = 'boon-card';
        card.style.animationDelay = `${index * 0.15}s`;

        card.innerHTML = `
          <div>
            <div class="card-header">
              <div class="boon-icon">${boon.icon}</div>
              <div>
                <div class="boon-slot">${boon.slotName}</div>
                <div class="rarity-tag rarity-${boon.rarity}">${boon.rarityText}</div>
              </div>
            </div>
            <div class="boon-name">${boon.name}</div>
            <div class="boon-desc">${boon.description}</div>
          </div>
          <div class="select-btn">選擇 (SELECT)</div>
        `;

        // 點擊事件：綁定選擇邏輯
        card.addEventListener('click', () => selectBoon(boon));

        container.appendChild(card);
      });
    }

    // 選擇祝福處理邏輯
    function selectBoon(selectedBoon) {
      console.log(`[玩家選擇了祝福]:`, selectedBoon);

      // 模擬淡出動畫
      document.querySelector('.overlay').style.transition = 'opacity 0.5s';
      document.querySelector('.overlay').style.opacity = '0';

      setTimeout(() => {
        alert(`成功獲得神恩：【${selectedBoon.name}】！\n(已套用至 ${selectedBoon.slotName})`);
        // 這裡可呼叫遊戲邏輯：playerBoonManager.equipBoon(selectedBoon);
        // 並且關閉 UI 或恢復遊戲運行 (gameUnpause)
      }, 500);
    }

    // 初始化介面
    renderBoons();
  </script>
</body>
</html>
