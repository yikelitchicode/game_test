<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>月蝕試煉：迷宮遠征</title>
  <style>
    :root { color-scheme: dark; --ink: #17141d; --panel: #211c2a; --line: #695b70; --gold: #f0d375; --aqua: #68d6c5; }
    * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #100f16; color: #ede6d7; font-family: "Noto Sans TC", "PingFang TC", sans-serif; }
    #shell { position: relative; width: min(100vw, 1100px); padding: 18px; } #game { display: block; width: 100%; aspect-ratio: 16 / 9; border: 1px solid #73616b; background: #15151b; box-shadow: 0 20px 54px #000a; cursor: crosshair; }
    #stageStatus { position: absolute; z-index: 2; top: 30px; left: 50%; min-width: 250px; padding: 8px 16px; transform: translateX(-50%); border: 1px solid #86725c; background: #17121cdd; color: #f5df9d; text-align: center; font-size: 16px; pointer-events: none; }
    #pauseButton { position: absolute; z-index: 3; top: 30px; right: 30px; width: 48px; height: 48px; border: 1px solid #88715d; border-radius: 5px; background: #17121cdd; color: #f7e4ad; font: 22px sans-serif; cursor: pointer; }
    #hud { display: flex; gap: 22px; justify-content: space-between; align-items: end; margin: 12px 2px 0; font-size: 16px; }.bars { display: grid; gap: 7px; min-width: 280px; }.bar { width: 100%; height: 14px; border: 1px solid #4c4056; background: #251d2d; overflow: hidden; }.fill { height: 100%; transition: width .12s linear; }#hp { background: #c75263; } #mana { background: #52b5b0; } #hint { color: #aca4b3; text-align: right; line-height: 1.45; }
    #weapons { display: flex; gap: 6px; }.weapon-btn { width: 54px; height: 54px; border: 1px solid #62566a; border-radius: 5px; background: #211b29; color: #d7cfde; font: 27px sans-serif; cursor: pointer; }.weapon-btn[aria-pressed="true"] { border-color: var(--gold); background: #4a3a42; color: #fff0bc; }.weapon-btn:disabled { opacity: .45; cursor: default; }
    #heroSelect, #boons, #gameover, #pauseMenu { position: fixed; z-index: 5; inset: 0; display: none; place-items: center; padding: 20px; background: #08060ae8; }.show { display: grid !important; }.modal { width: min(900px, 100%); text-align: center; } h1 { margin: 0 0 8px; color: var(--gold); font-size: 28px; }.sub { margin: 0 0 24px; color: var(--aqua); font-size: 13px; letter-spacing: 2px; }.heroes, .choices { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }.choices { grid-template-columns: repeat(3, 1fr); }.hero, .boon { min-height: 210px; padding: 16px; border: 1px solid #66556a; background: #1b1723; color: inherit; text-align: left; cursor: pointer; }.hero:hover, .boon:hover, .hero:focus-visible, .boon:focus-visible { border-color: var(--gold); background: #292033; outline: none; }.hero-icon { display: block; margin-bottom: 12px; color: var(--gold); font-size: 38px; }.hero h2, .boon h2 { margin: 0 0 8px; color: #f6ecda; font-size: 20px; }.hero p, .boon p { margin: 0; color: #c3bac8; line-height: 1.5; }.rarity { color: #b98be3; font-size: 12px; }.select { display: block; margin-top: 26px; color: var(--gold); font-size: 13px; } .action { padding: 13px 24px; border: 1px solid var(--gold); background: #2a2330; color: #f8e7a4; font: inherit; cursor: pointer; }#pauseActions { display: flex; justify-content: center; gap: 12px; margin-top: 24px; }
    #touch { display: none; } @media (max-width: 650px), (pointer: coarse) { body { place-items: start center; } #shell { padding: 8px; } #game { aspect-ratio: 4 / 3; } #stageStatus { top: 15px; min-width: 196px; font-size: 14px; } #pauseButton { top: 15px; right: 15px; } #hud { gap: 12px; flex-wrap: wrap; }.bars { min-width: 174px; }.bar { height: 13px; }#hint { max-width: 174px; font-size: 14px; }#weapons { order: 3; width: 100%; justify-content: center; }.weapon-btn { width: 61px; height: 61px; }.heroes { grid-template-columns: repeat(2, 1fr); }.hero { min-height: 165px; }.choices { grid-template-columns: 1fr; }.boon { min-height: 0; }#touch { display: flex; justify-content: space-between; align-items: end; padding: 18px 3px 0; touch-action: none; }.joystick { position: relative; width: 154px; height: 154px; border: 2px solid #796a81; border-radius: 50%; background: #241e2bcc; touch-action: none; }.joystick-thumb { position: absolute; left: 50%; top: 50%; width: 68px; height: 68px; border: 2px solid var(--gold); border-radius: 50%; background: #51c9bdcc; transform: translate(-50%, -50%); }.actions { display: grid; grid-template-columns: repeat(2, 76px); gap: 10px; }.touch-btn { width: 76px; height: 76px; border: 1px solid #b79a6d; border-radius: 50%; background: #2c2536e8; color: #f3e8cd; font: 27px sans-serif; }.touch-btn:active { background: #69536d; transform: scale(.93); } }
  </style>
</head>
<body>
  <main id="shell"><canvas id="game" width="1056" height="594" aria-label="月蝕迷宮遊戲畫面"></canvas><div id="stageStatus"></div><button id="pauseButton" aria-label="暫停" title="暫停">||</button>
    <div id="hud"><div class="bars"><div>生命 <span id="hpText"></span><div class="bar"><div class="fill" id="hp"></div></div></div><div>魔力 <span id="manaText"></span><div class="bar"><div class="fill" id="mana"></div></div></div><div id="skillText">專屬技能</div><div class="bar"><div class="fill" id="skill"></div></div></div><div id="hint">WASD / 方向鍵探索<br>滑鼠或 J 攻擊，E 專屬技能<br>空白鍵衝刺，= 切換 VIP</div><div id="weapons"><button class="weapon-btn" data-weapon="fist" title="拳套">&#128074;</button><button class="weapon-btn" data-weapon="sword" title="長劍">&#9876;</button><button class="weapon-btn" data-weapon="staff" title="法杖">&#10022;</button><button class="weapon-btn" data-weapon="bow" title="弓箭">&#10148;</button></div></div>
    <div id="touch"><div class="joystick" id="joystick"><div class="joystick-thumb" id="joystickThumb"></div></div><div class="actions"><button class="touch-btn" data-action="attack">&#9876;</button><button class="touch-btn" data-action="cast">&#9678;</button><button class="touch-btn" data-action="dash">&#9889;</button></div></div>
  </main>
  <section id="heroSelect" class="show"><div class="modal"><p class="sub">月蝕試煉：迷宮遠征</p><h1>選擇英雄</h1><div class="heroes"><button class="hero" data-hero="brawler"><span class="hero-icon">&#128074;</span><h2>鬥士</h2><p>拳套<br>近距離重拳與擊退</p></button><button class="hero" data-hero="swordsman"><span class="hero-icon">&#9876;</span><h2>劍士</h2><p>長劍<br>橫掃斬擊</p></button><button class="hero" data-hero="mage"><span class="hero-icon">&#10022;</span><h2>秘術師</h2><p>法杖<br>追蹤魔法彈</p></button><button class="hero" data-hero="ranger"><span class="hero-icon">&#10148;</span><h2>遊俠</h2><p>弓箭<br>高速遠程射擊</p></button></div></div></section>
  <section id="boons"><div class="modal"><p class="sub">發現月蝕遺物</p><h1>選擇一項力量</h1><div id="choices" class="choices"></div></div></section>
  <section id="pauseMenu"><div class="modal"><p class="sub">月蝕試煉</p><h1>已暫停</h1><div id="pauseActions"><button class="action" id="resume">繼續</button><button class="action" id="returnHome">返回英雄選擇</button></div></div></section>
  <section id="gameover"><div class="modal"><p class="sub" id="resultSub">月蝕試煉</p><h1 id="resultTitle">遠征結束</h1><p id="score"></p><button class="action" id="restart">再次遠征</button></div></section>
  <script src="maze.js"></script>
</body></html>
