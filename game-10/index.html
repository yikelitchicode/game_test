<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>月蝕試煉</title>
  <style>

    .bars { display: grid; gap: 7px; min-width: 280px; }
    .bar { width: 100%; height: 14px; border: 1px solid #4c4056; background: #251d2d; overflow: hidden; }
    .fill { height: 100%; transition: width .12s linear; }
    #hp { background: #c75263; } #mana { background: #52b5b0; }

    #weapons { display: flex; gap: 6px; align-items: center; }

    .sub { margin: 0 0 25px; color: #77d6cc; letter-spacing: 2px; font-size: 13px; }
    .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .boon { min-height: 250px; padding: 20px; display: flex; flex-direction: column; align-items: flex-start; text-align: left; background: #1b1723; border: 1px solid #5d5065; color: inherit; cursor: pointer; transition: transform .16s, border-color .16s, background .16s; }
    .boon:hover, .boon:focus-visible { transform: translateY(-5px); border-color: #e0be59; background: #251f2d; outline: none; }
    .rarity { color: #ba83e5; font-size: 12px; letter-spacing: 1px; }
    .boon h2 { margin: 13px 0 10px; font-size: 20px; color: #f5eedf; }
    .boon p { margin: 0; color: #c9c1cf; line-height: 1.55; }
    .select { margin-top: auto; padding-top: 20px; color: #f3d980; font-size: 13px; }
    #restart, .pause-action { padding: 13px 24px; border: 1px solid #e0be59; background: #2a2330; color: #f8e7a4; font: inherit; cursor: pointer; } #pauseActions { display: flex; justify-content: center; gap: 12px; margin-top: 24px; }
    #heroSelect { z-index: 5; } #heroSelect .modal { width: min(760px, 100%); } .heroes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; } .hero { min-height: 228px; padding: 16px; border: 1px solid #66556a; background: #1b1723; color: inherit; text-align: left; cursor: pointer; } .hero:hover, .hero:focus-visible { border-color: #f0cc69; background: #292033; outline: none; } .hero-icon { display: block; margin-bottom: 14px; color: #f3d980; font-size: 38px; } .hero h2 { margin: 0 0 8px; color: #f6ecda; font-size: 20px; } .hero p { margin: 0; color: #bfb5c5; line-height: 1.45; } #weapons.locked .weapon-btn:not([aria-pressed="true"]) { display: none; } #weapons.locked .weapon-btn { cursor: default; }
    #touch { display: none; }
    @media (max-width: 650px), (pointer: coarse) { body { place-items: start center; } #shell { padding: 8px; } #game { aspect-ratio: 4 / 3; } #stageStatus { top: 16px; min-width: 164px; font-size: 13px; } #hud { font-size: 14px; gap: 10px; flex-wrap: wrap; } .bars { min-width: 158px; } .bar { height: 12px; } #hint { max-width: 184px; } #weapons { order: 3; width: 100%; justify-content: center; } .weapon-btn { width: 54px; height: 54px; font-size: 27px; } .choices { grid-template-columns: 1fr; } .boon { min-height: 0; padding: 15px; } .boon h2 { margin: 6px 0; } .select { padding-top: 10px; } #touch { display: flex; justify-content: space-between; align-items: end; padding: 14px 3px 0; touch-action: none; } .joystick { position: relative; width: 142px; height: 142px; border: 2px solid #796a81; border-radius: 50%; background: #241e2bcc; box-shadow: inset 0 0 0 13px #ffffff08; touch-action: none; } .joystick::before, .joystick::after { content: ""; position: absolute; background: #ffffff14; } .joystick::before { left: 50%; top: 12px; bottom: 12px; width: 1px; } .joystick::after { top: 50%; left: 12px; right: 12px; height: 1px; } .joystick-thumb { position: absolute; left: 50%; top: 50%; width: 62px; height: 62px; border: 2px solid #f3d980; border-radius: 50%; background: #51c9bdcc; box-shadow: 0 0 14px #51c9bd88; transform: translate(-50%, -50%); will-change: transform; } .actions { display: grid; grid-template-columns: repeat(2, 66px); gap: 10px; } .touch-btn { width: 66px; height: 66px; border: 1px solid #b79a6d; border-radius: 50%; background: #2c2536e8; color: #f3e8cd; font: 24px system-ui; box-shadow: inset 0 1px #ffffff21; } .touch-btn[data-action="cast"] { color: #dcbbff; } .touch-btn[data-action="dash"] { color: #78e4d9; } .touch-btn:active { background: #69536d; border-color: #f0d477; transform: scale(.93); } }
    @media (max-width: 650px), (pointer: coarse) { #stageStatus { top: 14px; min-width: 190px; padding: 8px 13px; font-size: 16px; } #pauseButton { top: 14px; right: 14px; width: 44px; height: 44px; } #spawnCountdown { top: calc(2px + 37.5vw); font-size: 64px; } #hud { gap: 12px; font-size: 16px; } .bars { min-width: 174px; gap: 7px; } .bar { height: 14px; } #hint { max-width: 174px; } .weapon-btn { width: 64px; height: 64px; font-size: 32px; } #touch { padding-top: 18px; } .joystick { width: 164px; height: 164px; } .joystick-thumb { width: 70px; height: 70px; } .actions { grid-template-columns: repeat(2, 78px); gap: 12px; } .touch-btn { width: 78px; height: 78px; font-size: 28px; } #heroSelect { align-items: start; overflow-y: auto; } #heroSelect .modal { padding: 28px 0; } .heroes { grid-template-columns: repeat(2, 1fr); gap: 10px; } .hero { min-height: 170px; padding: 13px; } .hero-icon { margin-bottom: 7px; font-size: 31px; } .hero h2 { font-size: 18px; } }
  </style>
</head>
<body>
  <main id="shell">

  </main>
  <section id="heroSelect" class="show" aria-label="選擇英雄"><div class="modal"><p class="sub">月蝕試煉</p><h1>選擇英雄</h1><div class="heroes"><button class="hero" data-hero="brawler"><span class="hero-icon">&#128074;</span><h2>鬥士</h2><p>拳套<br>近距離重拳與擊退</p></button><button class="hero" data-hero="swordsman"><span class="hero-icon">&#9876;</span><h2>劍士</h2><p>長劍<br>橫向揮劍斬擊</p></button><button class="hero" data-hero="mage"><span class="hero-icon">&#10022;</span><h2>秘術師</h2><p>法杖<br>自動追蹤魔法彈</p></button><button class="hero" data-hero="ranger"><span class="hero-icon">&#10148;</span><h2>遊俠</h2><p>弓箭<br>高速度遠程射擊</p></button></div></div></section>

      joystickBase.addEventListener('pointerdown', event => { event.preventDefault(); joystick.pointerId = event.pointerId; joystickBase.setPointerCapture(event.pointerId); moveJoystick(event); });
      joystickBase.addEventListener('pointermove', event => { if (event.pointerId === joystick.pointerId) moveJoystick(event); });
      joystickBase.addEventListener('pointerup', resetJoystick); joystickBase.addEventListener('pointercancel', resetJoystick);
      const aimAtClosestEnemy = () => { const target = closestEnemy(); if (target) player.facing = Math.atan2(target.y - player.y, target.x - player.x); };
      ui.weapons.forEach(button => button.addEventListener('click', () => setWeapon(button.dataset.weapon)));
      document.querySelectorAll('[data-action]').forEach(button => button.addEventListener('pointerdown', e => { e.preventDefault(); const action = button.dataset.action; if (action === 'attack') { aimAtClosestEnemy(); attack(); } if (action === 'cast') cast(); if (action === 'dash') dash(); }));
      document.querySelectorAll('[data-hero]').forEach(button => button.addEventListener('click', () => { weaponLocked = false; reset(button.dataset.hero); weaponLocked = true; ui.weaponBar.classList.add('locked'); ui.heroSelect.classList.remove('show'); if (!loopStarted) { loopStarted = true; requestAnimationFrame(loop); } }));
      ui.pauseButton.addEventListener('click', () => { if (!player || paused || ui.boons.classList.contains('show') || ui.gameover.classList.contains('show')) return; paused = true; ui.pauseMenu.classList.add('show'); });
      document.querySelector('#resume').addEventListener('click', () => { ui.pauseMenu.classList.remove('show'); paused = false; });
      document.querySelector('#returnHome').addEventListener('click', () => { ui.pauseMenu.classList.remove('show'); ui.heroSelect.classList.add('show'); ui.weaponBar.classList.remove('locked'); ui.countdown.classList.remove('show'); weaponLocked = false; paused = true; });
    })();
  </script>
</body>
