<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>月蝕試煉</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #11101a; color: #eee7d7; font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif; }
    #shell { width: min(100vw, 1100px); padding: 18px; }
    #game { width: 100%; aspect-ratio: 16 / 9; display: block; background: #191424; border: 1px solid #66525f; box-shadow: 0 18px 50px #0008; cursor: crosshair; }
    #hud { display: flex; gap: 18px; justify-content: space-between; align-items: end; margin: 10px 2px 0; font-size: 14px; }
    .bars { display: grid; gap: 5px; min-width: 230px; }
    .bar { width: 100%; height: 10px; border: 1px solid #4c4056; background: #251d2d; overflow: hidden; }
    .fill { height: 100%; transition: width .12s linear; }
    #hp { background: #c75263; } #mana { background: #52b5b0; }
    #hint { color: #aca4b3; text-align: right; line-height: 1.45; }
    #weapons { display: flex; gap: 6px; align-items: center; }
    .weapon-btn { width: 42px; height: 42px; padding: 0; border: 1px solid #62566a; border-radius: 6px; background: #211b29; color: #d7cfde; font: 21px system-ui; cursor: pointer; }
    .weapon-btn[aria-pressed="true"] { border-color: #f2d16d; background: #4a3a42; color: #fff0bc; box-shadow: inset 0 0 0 1px #f2d16d55; }
    #boons, #gameover { position: fixed; inset: 0; display: none; place-items: center; padding: 20px; background: #08060ad9; }
    #boons.show, #gameover.show { display: grid; }
    .modal { width: min(920px, 100%); text-align: center; }
    h1 { margin: 0 0 8px; font-size: 28px; color: #f3d980; letter-spacing: 0; }
    .sub { margin: 0 0 25px; color: #77d6cc; letter-spacing: 2px; font-size: 13px; }
    .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .boon { min-height: 250px; padding: 20px; display: flex; flex-direction: column; align-items: flex-start; text-align: left; background: #1b1723; border: 1px solid #5d5065; color: inherit; cursor: pointer; transition: transform .16s, border-color .16s, background .16s; }
    .boon:hover, .boon:focus-visible { transform: translateY(-5px); border-color: #e0be59; background: #251f2d; outline: none; }
    .rarity { color: #ba83e5; font-size: 12px; letter-spacing: 1px; }
    .boon h2 { margin: 13px 0 10px; font-size: 20px; color: #f5eedf; }
    .boon p { margin: 0; color: #c9c1cf; line-height: 1.55; }
    .select { margin-top: auto; padding-top: 20px; color: #f3d980; font-size: 13px; }
    #restart { padding: 11px 20px; border: 1px solid #e0be59; background: #2a2330; color: #f8e7a4; font: inherit; cursor: pointer; }
    #touch { display: none; }
    @media (max-width: 650px), (pointer: coarse) { body { place-items: start center; } #shell { padding: 8px; } #game { aspect-ratio: 4 / 3; } #hud { font-size: 14px; gap: 10px; flex-wrap: wrap; } .bars { min-width: 158px; } .bar { height: 12px; } #hint { max-width: 184px; } #weapons { order: 3; width: 100%; justify-content: center; } .weapon-btn { width: 54px; height: 54px; font-size: 27px; } .choices { grid-template-columns: 1fr; } .boon { min-height: 0; padding: 15px; } .boon h2 { margin: 6px 0; } .select { padding-top: 10px; } #touch { display: flex; justify-content: space-between; align-items: end; padding: 14px 3px 0; touch-action: none; } .joystick { position: relative; width: 142px; height: 142px; border: 2px solid #796a81; border-radius: 50%; background: #241e2bcc; box-shadow: inset 0 0 0 13px #ffffff08; touch-action: none; } .joystick::before, .joystick::after { content: ""; position: absolute; background: #ffffff14; } .joystick::before { left: 50%; top: 12px; bottom: 12px; width: 1px; } .joystick::after { top: 50%; left: 12px; right: 12px; height: 1px; } .joystick-thumb { position: absolute; left: 50%; top: 50%; width: 62px; height: 62px; border: 2px solid #f3d980; border-radius: 50%; background: #51c9bdcc; box-shadow: 0 0 14px #51c9bd88; transform: translate(-50%, -50%); will-change: transform; } .actions { display: grid; grid-template-columns: repeat(2, 66px); gap: 10px; } .touch-btn { width: 66px; height: 66px; border: 1px solid #b79a6d; border-radius: 50%; background: #2c2536e8; color: #f3e8cd; font: 24px system-ui; box-shadow: inset 0 1px #ffffff21; } .touch-btn[data-action="cast"] { color: #dcbbff; } .touch-btn[data-action="dash"] { color: #78e4d9; } .touch-btn:active { background: #69536d; border-color: #f0d477; transform: scale(.93); } }
  </style>
</head>
<body>
  <main id="shell">
    <canvas id="game" width="1056" height="594" aria-label="月蝕試煉遊戲畫面"></canvas>
    <div id="hud">
      <div class="bars"><div>生命 <span id="hpText"></span><div class="bar"><div class="fill" id="hp"></div></div></div><div>魔力 <span id="manaText"></span><div class="bar"><div class="fill" id="mana"></div></div></div></div>
      <div id="hint">第 <b id="wave">1</b> 波　擊敗 <b id="remaining">0</b> 名敵人<br>WASD / 方向鍵移動　滑鼠或 J 攻擊　1-3 切換武器</div>
      <div id="weapons" role="group" aria-label="武器選擇"><button class="weapon-btn" data-weapon="sword" aria-label="劍" title="劍（1）" aria-pressed="true">&#9876;</button><button class="weapon-btn" data-weapon="staff" aria-label="法杖，自動瞄準" title="法杖，自動瞄準（2）" aria-pressed="false">&#10022;</button><button class="weapon-btn" data-weapon="bow" aria-label="弓箭" title="弓箭（3）" aria-pressed="false">&#10148;</button></div>
    </div>
    <div id="touch" aria-label="觸控操作"><div class="joystick" id="joystick" aria-label="移動搖桿"><div class="joystick-thumb" id="joystickThumb"></div></div><div class="actions"><button class="touch-btn" data-action="attack" aria-label="攻擊" title="攻擊">&#9876;</button><button class="touch-btn" data-action="cast" aria-label="法陣" title="法陣">&#9678;</button><button class="touch-btn" data-action="dash" aria-label="衝刺" title="衝刺">&#9889;</button></div></div>
  </main>
  <section id="boons" aria-label="選擇祝福"><div class="modal"><p class="sub">阿波羅的祝福</p><h1>選擇一項力量</h1><div id="choices" class="choices"></div></div></section>
  <section id="gameover"><div class="modal"><p class="sub">月蝕試煉</p><h1>你倒下了</h1><p id="score"></p><button id="restart">重新開始</button></div></section>
  <script>
    (() => {
      const canvas = document.querySelector('#game'), ctx = canvas.getContext('2d');
      const touchLayout = window.matchMedia('(max-width: 650px), (pointer: coarse)').matches;
      if (touchLayout) canvas.height = 792;
      const W = canvas.width, H = canvas.height, keys = new Set();
      const mouse = { x: W / 2, y: H / 2 };
      const joystick = { x: 0, y: 0, pointerId: null };
      const ui = { hp: document.querySelector('#hp'), mana: document.querySelector('#mana'), hpText: document.querySelector('#hpText'), manaText: document.querySelector('#manaText'), wave: document.querySelector('#wave'), remaining: document.querySelector('#remaining'), boons: document.querySelector('#boons'), choices: document.querySelector('#choices'), gameover: document.querySelector('#gameover'), score: document.querySelector('#score'), weapons: [...document.querySelectorAll('[data-weapon]')] };
      const loadSprite = source => { const image = new Image(); image.src = source; return image; };
      const loadFrames = (folder, numbers) => numbers.map(number => loadSprite(`assets/effects/wills_pixel_explosions_sample/${folder}/PNG/frame${String(number).padStart(4, '0')}.png`));
      const effectFrames = [8, 12, 16, 20, 24, 28, 32, 36, 40, 44, 48, 52, 56, 60];
      const sprites = { player: loadSprite('kenney_tinyDungeon/Tiles/tile_0099.png'), enemy: loadSprite('kenney_tinyDungeon/Tiles/tile_0096.png'), portraitFrame: loadSprite('assets/ui/panel-transparent-border-000.png'), burst: loadFrames('round_explosion', effectFrames), vortex: loadFrames('round_vortex', effectFrames) };
      const actorScale = touchLayout ? 1.45 : 1;
      ctx.imageSmoothingEnabled = false;
      let player, enemies, effects, wave, paused, kills, last, nextWaveTimer;
      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
      const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
      const boons = [
        { name: '熾耀耀擊', rarity: '史詩', text: '普通攻擊傷害 +45%，範圍 +25%。', apply: p => { p.damage *= 1.45; p.attackRadius *= 1.25; } },
        { name: '日輪法陣', rarity: '稀有', text: '法陣範圍 +35%，每秒傷害提高。', apply: p => { p.castRadius *= 1.35; p.castDamage += 12; } },
        { name: '炫光奔襲', rarity: '普通', text: '衝刺冷卻縮短，移動速度 +15%。', apply: p => { p.speed *= 1.15; p.dashCd *= .68; } },
        { name: '月桂護佑', rarity: '稀有', text: '最大生命 +35，立即回復 35 生命。', apply: p => { p.maxHp += 35; p.hp = Math.min(p.maxHp, p.hp + 35); } },
        { name: '星火回響', rarity: '普通', text: '魔力回復速度 +60%，施法消耗 -4。', apply: p => { p.manaRegen *= 1.6; p.castCost = Math.max(6, p.castCost - 4); } }
      ];
      function reset() {
        player = { x: W / 2, y: H / 2, r: 15, hp: 100, maxHp: 100, mana: 100, maxMana: 100, speed: 255, damage: 28, attackRadius: 62, castRadius: 94, castDamage: 17, castCost: 20, manaRegen: 13, dashCd: 650, dashUntil: 0, dashReady: 0, attackReady: 0, invuln: 0, facing: 0, weapon: 'sword' };
        enemies = []; effects = []; wave = 1; kills = 0; paused = false; nextWaveTimer = 0; ui.gameover.classList.remove('show'); ui.boons.classList.remove('show'); setWeapon('sword'); spawnWave();
      }
      function spawnWave() {
        const count = 3 + wave * 2;
        for (let i = 0; i < count; i++) { let x, y; do { x = 45 + Math.random() * (W - 90); y = 70 + Math.random() * (H - 145); } while (Math.hypot(x - player.x, y - player.y) < 210); enemies.push({ x, y, r: 13 + Math.min(wave, 5), hp: 48 + wave * 20, maxHp: 48 + wave * 20, speed: 50 + wave * 7, hit: 0, slow: 0 }); }
        ui.wave.textContent = wave;
      }
      function setWeapon(weapon) { player.weapon = weapon; ui.weapons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.weapon === weapon))); }
      function closestEnemy(maxDistance = Infinity) { return enemies.filter(e => !e.dead && dist(e, player) <= maxDistance).sort((a, b) => dist(a, player) - dist(b, player))[0]; }
      function launchProjectile(kind, angle, target) {
        const staff = kind === 'staff', speed = staff ? 440 : 590, offset = staff ? 24 : 32;
        effects.push({ type: 'projectile', kind, x: player.x + Math.cos(angle) * offset, y: player.y + Math.sin(angle) * offset, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, angle, target, r: staff ? 15 : 7, damage: player.damage * (staff ? 1.1 : .85), frames: staff ? sprites.vortex : null, until: performance.now() + (staff ? 1500 : 1050) });
        effects.push({ type: staff ? 'staffCast' : 'bowShot', x: player.x + Math.cos(angle) * 24, y: player.y + Math.sin(angle) * 24, angle, frames: staff ? sprites.vortex : sprites.burst, until: performance.now() + 220 });
      }
      function attack() {
        const now = performance.now(); if (paused || now < player.attackReady) return;
        if (player.weapon === 'sword') {
          player.attackReady = now + 290;
          const x = player.x + Math.cos(player.facing) * 44, y = player.y + Math.sin(player.facing) * 44;
          effects.push({ type: 'slash', x, y, r: player.attackRadius, angle: player.facing, frames: sprites.burst, until: now + 260 });
          enemies.forEach(e => { const angle = Math.atan2(e.y - player.y, e.x - player.x), delta = Math.atan2(Math.sin(angle - player.facing), Math.cos(angle - player.facing)); if (Math.abs(delta) < 1.08 && Math.hypot(e.x - x, e.y - y) < player.attackRadius + e.r) hurtEnemy(e, player.damage, player.x, player.y, 215); });
        } else if (player.weapon === 'staff') {
          const target = closestEnemy(500); if (!target) return; player.attackReady = now + 410; player.facing = Math.atan2(target.y - player.y, target.x - player.x); launchProjectile('staff', player.facing, target);
        } else {
          player.attackReady = now + 340; launchProjectile('bow', player.facing);
        }
      }
      function cast() {
        if (paused || player.mana < player.castCost) return;
        player.mana -= player.castCost; effects.push({ type: 'cast', x: player.x, y: player.y, r: player.castRadius, frames: sprites.vortex, until: performance.now() + 2800, tick: 0 });
      }
      function dash() { const now = performance.now(); if (paused || now < player.dashReady) return; player.dashReady = now + player.dashCd; player.dashUntil = now + 145; player.invuln = now + 190; effects.push({ type: 'dash', x: player.x, y: player.y, frames: sprites.vortex, until: now + 360 }); }
      function hurtEnemy(e, amount, sourceX = player.x, sourceY = player.y, knockback = 120) { if (e.dead) return; e.hp -= amount; e.hit = performance.now() + 100; const length = Math.hypot(e.x - sourceX, e.y - sourceY) || 1; e.kx = (e.x - sourceX) / length * knockback; e.ky = (e.y - sourceY) / length * knockback; e.knockUntil = performance.now() + 115; effects.push({ type: 'impact', x: e.x, y: e.y, frames: sprites.burst, until: performance.now() + 290 }); effects.push({ type: 'number', x: e.x, y: e.y - 10, text: Math.round(amount), until: performance.now() + 500 }); if (e.hp <= 0) { e.dead = true; kills++; } }
      function chooseBoon() {
        paused = true; ui.choices.innerHTML = '';
        [...boons].sort(() => Math.random() - .5).slice(0, 3).forEach(b => { const button = document.createElement('button'); button.className = 'boon'; button.innerHTML = `<span class="rarity">${b.rarity}</span><h2>${b.name}</h2><p>${b.text}</p><span class="select">點擊選擇</span>`; button.onclick = () => { b.apply(player); ui.boons.classList.remove('show'); paused = false; wave++; spawnWave(); }; ui.choices.append(button); });
        ui.boons.classList.add('show');
      }
      function update(now, dt) {
        if (paused) return;
        const dx = joystick.x + (keys.has('d') || keys.has('arrowright') ? 1 : 0) - (keys.has('a') || keys.has('arrowleft') ? 1 : 0);
        const dy = joystick.y + (keys.has('s') || keys.has('arrowdown') ? 1 : 0) - (keys.has('w') || keys.has('arrowup') ? 1 : 0);
        const length = Math.hypot(dx, dy), strength = Math.min(1, length), speed = player.speed * (now < player.dashUntil ? 3.2 : 1);
        if (length) { player.x = clamp(player.x + dx / length * speed * strength * dt, player.r, W - player.r); player.y = clamp(player.y + dy / length * speed * strength * dt, player.r, H - player.r); } player.mana = Math.min(player.maxMana, player.mana + player.manaRegen * dt);
        effects.filter(f => f.type === 'cast').forEach(f => { if (now - f.tick > 300) { f.tick = now; enemies.forEach(e => { if (dist(e, f) < f.r + e.r) { hurtEnemy(e, player.castDamage); e.slow = now + 360; } }); } });
        effects.filter(f => f.type === 'projectile').forEach(f => { if (f.kind === 'staff' && f.target && !f.target.dead) { const desired = Math.atan2(f.target.y - f.y, f.target.x - f.x), current = Math.atan2(f.vy, f.vx), turn = Math.atan2(Math.sin(desired - current), Math.cos(desired - current)); f.angle = current + clamp(turn, -.16, .16); const speed = Math.hypot(f.vx, f.vy); f.vx = Math.cos(f.angle) * speed; f.vy = Math.sin(f.angle) * speed; } f.x += f.vx * dt; f.y += f.vy * dt; const hit = enemies.find(e => !e.dead && Math.hypot(e.x - f.x, e.y - f.y) < e.r + f.r); if (hit) { hurtEnemy(hit, f.damage, f.x - f.vx, f.y - f.vy, f.kind === 'staff' ? 180 : 145); f.until = now; } });
        enemies.forEach(e => { if (e.dead) return; if (now < e.knockUntil) { e.x = clamp(e.x + e.kx * dt, e.r, W - e.r); e.y = clamp(e.y + e.ky * dt, e.r, H - e.r); return; } const d = dist(e, player), rate = now < e.slow ? .15 : 1; if (d > player.r + e.r + 3) { e.x += (player.x - e.x) / d * e.speed * rate * dt; e.y += (player.y - e.y) / d * e.speed * rate * dt; } else if (now > player.invuln) { player.hp -= (9 + wave * 1.2) * dt; player.invuln = now + 420; } });
        enemies = enemies.filter(e => !e.dead); effects = effects.filter(f => f.until > now); if (!enemies.length && !nextWaveTimer) nextWaveTimer = now + 550; if (nextWaveTimer && now >= nextWaveTimer) { nextWaveTimer = 0; chooseBoon(); } if (player.hp <= 0) { paused = true; ui.score.textContent = `你在第 ${wave} 波擊敗了 ${kills} 名敵人。`; ui.gameover.classList.add('show'); }
      }
      function draw(now) {
        ctx.fillStyle = '#16121e'; ctx.fillRect(0, 0, W, H);
        ctx.strokeStyle = '#2b2435'; ctx.lineWidth = 1; for (let x = 0; x < W; x += 48) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); } for (let y = 0; y < H; y += 48) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
        effects.forEach(f => { const life = f.until - now, elapsed = 1 - life / ({ cast: 2800, slash: 260, dash: 360, impact: 290, staffCast: 220, bowShot: 220, projectile: 1500 }[f.type] || 500), frame = f.frames && f.frames[Math.min(f.frames.length - 1, Math.floor(elapsed * f.frames.length))]; if (f.type === 'cast') { ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fillStyle = '#9b70d633'; ctx.fill(); ctx.strokeStyle = '#d8a8ff'; ctx.lineWidth = 2; ctx.stroke(); if (frame && frame.complete) ctx.drawImage(frame, f.x - f.r, f.y - f.r, f.r * 2, f.r * 2); } if (f.type === 'slash' || f.type === 'impact' || f.type === 'bowShot') { const size = f.type === 'slash' ? f.r * 2.1 : f.type === 'bowShot' ? 46 : 86; if (frame && frame.complete) ctx.drawImage(frame, f.x - size / 2, f.y - size / 2, size, size); } if (f.type === 'staffCast') { const size = 60 * (1 - elapsed * .35); if (frame && frame.complete) ctx.drawImage(frame, f.x - size / 2, f.y - size / 2, size, size); } if (f.type === 'projectile') { if (f.kind === 'staff') { const size = 44; if (frame && frame.complete) ctx.drawImage(frame, f.x - size / 2, f.y - size / 2, size, size); ctx.beginPath(); ctx.arc(f.x, f.y, 7, 0, Math.PI * 2); ctx.fillStyle = '#e6b8ff'; ctx.fill(); } else { ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.angle); ctx.fillStyle = '#e7d6a6'; ctx.fillRect(-16, -2, 27, 4); ctx.fillStyle = '#b87953'; ctx.beginPath(); ctx.moveTo(15, 0); ctx.lineTo(8, -6); ctx.lineTo(8, 6); ctx.closePath(); ctx.fill(); ctx.restore(); } } if (f.type === 'dash') { const size = 74 + (1 - elapsed) * 36; if (frame && frame.complete) ctx.drawImage(frame, f.x - size / 2, f.y - size / 2, size, size); } if (f.type === 'number') { ctx.fillStyle = '#ffe8a3'; ctx.font = 'bold 16px system-ui'; ctx.fillText(`-${f.text}`, f.x, f.y - (500 - life) / 18); } });
        enemies.forEach(e => { const visualRadius = e.r * actorScale; ctx.beginPath(); ctx.arc(e.x, e.y, visualRadius + 3, 0, Math.PI * 2); ctx.fillStyle = now < e.slow ? '#a976d255' : (now < e.hit ? '#fff0b066' : '#c9526255'); ctx.fill(); if (sprites.enemy.complete) ctx.drawImage(sprites.enemy, e.x - visualRadius * 1.45, e.y - visualRadius * 1.45, visualRadius * 2.9, visualRadius * 2.9); else { ctx.beginPath(); ctx.arc(e.x, e.y, visualRadius, 0, Math.PI * 2); ctx.fillStyle = '#c95262'; ctx.fill(); } ctx.fillStyle = '#2d1822'; ctx.fillRect(e.x - visualRadius, e.y - visualRadius - 10, visualRadius * 2, 5); ctx.fillStyle = '#ef8b8d'; ctx.fillRect(e.x - visualRadius, e.y - visualRadius - 10, visualRadius * 2 * Math.max(0, e.hp / e.maxHp), 5); });
        ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.facing); const playerSize = 50 * actorScale; if (sprites.player.complete) ctx.drawImage(sprites.player, -playerSize / 2, -playerSize / 2, playerSize, playerSize); else { ctx.beginPath(); ctx.moveTo(20, 0); ctx.lineTo(-12, -13); ctx.lineTo(-6, 0); ctx.lineTo(-12, 13); ctx.closePath(); ctx.fillStyle = now < player.invuln ? '#d9fffa' : '#52cfc3'; ctx.fill(); } if (player.weapon === 'sword') { ctx.strokeStyle = '#f5e5af'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(8, -5); ctx.lineTo(37, -5); ctx.stroke(); ctx.strokeStyle = '#b77b5b'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(4, -5); ctx.lineTo(13, 5); ctx.stroke(); } else if (player.weapon === 'staff') { ctx.strokeStyle = '#9569cf'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(6, 8); ctx.lineTo(29, -18); ctx.stroke(); ctx.beginPath(); ctx.arc(31, -20, 6, 0, Math.PI * 2); ctx.fillStyle = '#dfb7ff'; ctx.fill(); } else { ctx.strokeStyle = '#c99c62'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(14, 0, 15, -Math.PI / 2, Math.PI / 2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(14, -15); ctx.lineTo(14, 15); ctx.strokeStyle = '#eee0bb'; ctx.lineWidth = 1; ctx.stroke(); } ctx.restore();
        if (sprites.portraitFrame.complete) ctx.drawImage(sprites.portraitFrame, 10, 10, 76, 76); if (sprites.player.complete) { ctx.save(); ctx.beginPath(); ctx.rect(20, 20, 56, 56); ctx.clip(); ctx.drawImage(sprites.player, 18, 18, 60, 60); ctx.restore(); }
        ui.hp.style.width = `${clamp(player.hp / player.maxHp * 100, 0, 100)}%`; ui.mana.style.width = `${player.mana / player.maxMana * 100}%`; ui.hpText.textContent = `${Math.ceil(Math.max(0, player.hp))}/${player.maxHp}`; ui.manaText.textContent = `${Math.floor(player.mana)}/${player.maxMana}`; ui.remaining.textContent = enemies.length;
      }
      function loop(now) { const dt = Math.min(.05, (now - last) / 1000 || 0); last = now; update(now, dt); draw(now); requestAnimationFrame(loop); }
      window.addEventListener('keydown', e => { const k = e.key.toLowerCase(); if (['arrowup','arrowdown','arrowleft','arrowright',' ','j','e','1','2','3'].includes(k)) e.preventDefault(); keys.add(k); if (!e.repeat && k === ' ') dash(); if (!e.repeat && k === 'e') cast(); if (!e.repeat && k === 'j') attack(); if (!e.repeat && k === '1') setWeapon('sword'); if (!e.repeat && k === '2') setWeapon('staff'); if (!e.repeat && k === '3') setWeapon('bow'); }); window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
      canvas.addEventListener('mousemove', e => { const r = canvas.getBoundingClientRect(); mouse.x = (e.clientX - r.left) * W / r.width; mouse.y = (e.clientY - r.top) * H / r.height; player.facing = Math.atan2(mouse.y - player.y, mouse.x - player.x); }); canvas.addEventListener('mousedown', attack); document.querySelector('#restart').onclick = reset;
      const joystickBase = document.querySelector('#joystick'), joystickThumb = document.querySelector('#joystickThumb');
      const resetJoystick = () => { joystick.x = 0; joystick.y = 0; joystick.pointerId = null; joystickThumb.style.transform = 'translate(-50%, -50%)'; };
      const moveJoystick = event => { const rect = joystickBase.getBoundingClientRect(), limit = rect.width * .31; let x = event.clientX - rect.left - rect.width / 2, y = event.clientY - rect.top - rect.height / 2; const length = Math.hypot(x, y); if (length > limit) { x = x / length * limit; y = y / length * limit; } joystick.x = x / limit; joystick.y = y / limit; joystickThumb.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`; };
      joystickBase.addEventListener('pointerdown', event => { event.preventDefault(); joystick.pointerId = event.pointerId; joystickBase.setPointerCapture(event.pointerId); moveJoystick(event); });
      joystickBase.addEventListener('pointermove', event => { if (event.pointerId === joystick.pointerId) moveJoystick(event); });
      joystickBase.addEventListener('pointerup', resetJoystick); joystickBase.addEventListener('pointercancel', resetJoystick);
      const aimAtClosestEnemy = () => { const target = closestEnemy(); if (target) player.facing = Math.atan2(target.y - player.y, target.x - player.x); };
      ui.weapons.forEach(button => button.addEventListener('click', () => setWeapon(button.dataset.weapon)));
      document.querySelectorAll('[data-action]').forEach(button => button.addEventListener('pointerdown', e => { e.preventDefault(); const action = button.dataset.action; if (action === 'attack') { aimAtClosestEnemy(); attack(); } if (action === 'cast') cast(); if (action === 'dash') dash(); }));
      reset(); requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
